[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockworld"
version = "0.2.0"
description = "Block-level geology-ecology sandbox: does replacing a component flip the feasibility verdict?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xbotsd", email = "3468858545@qq.com" }]
keywords = [
    "geotechnical", "bearing-capacity", "geology", "sandbox",
    "sensitivity-analysis", "monte-carlo", "morris-screening",
    "decision-support", "reproducibility",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.26", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/Xbotsd/blockworld"
Issues = "https://github.com/Xbotsd/blockworld/issues"

[project.scripts]
blockworld = "blockworld.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blockworld = ["py.typed"]
